[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpilot"
version = "0.2.0"
description = "A local-first workflow automation engine with CLI and app-style web dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "FlowPilot Contributors" }]
keywords = ["automation", "workflow", "cli", "dashboard", "task-runner", "pwa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
flowpilot = "flowpilot.cli:main"

[tool.setuptools.packages.find]
include = ["flowpilot*"]

[tool.setuptools.package-data]
flowpilot = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js", "dashboard/*.webmanifest", "dashboard/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
