<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">FlowPilot — Workflow Automation Studio</title><desc id="desc">A dark navy and violet banner illustrating connected workflow cards.</desc>
