<text x="110" y="350" fill="#a99fff" font-family="Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-2">move itself.</text>
<text x="113" y="397" fill="#a9b7d1" font-family="Arial,sans-serif" font-size="19">A local-first Python workflow engine with a CLI and installable dashboard.</text>
